[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "input-latency-bench"
version = "0.2.0"
description = "Windows input/timer latency benchmarking CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "negg0s" }]
keywords = ["latency", "benchmark", "windows", "input", "timer", "qpc"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Benchmark",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/negg0s/input-latency-bench"
Repository = "https://github.com/negg0s/input-latency-bench.git"
Issues = "https://github.com/negg0s/input-latency-bench/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
input-latency-bench = "input_latency_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
